[project]
name = "the-toolbox"
version = "0.1.0"
description = "The Toolbox MCP, powered by Librarian"
requires-python = ">=3.11"
dependencies = ["mcp>=1.12,<2"]

[project.scripts]
the-toolbox = "toolbox:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["toolbox.py"]
